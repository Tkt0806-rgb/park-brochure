<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>公園マップ</title>

<style>
body {
    margin: 0;
    text-align: center;
    font-family: sans-serif;
}

/* =========================
   地図全体
========================= */

.map-container {
    position: relative;
    width: 1000px;
    max-width: 100%;
    margin: 0 auto;

    container-type: inline-size;
}

.map {
    width: 100%;
    height: auto;
    display: block;
}

/* =========================
   おすすめスポット（赤丸）
========================= */

.spot {
    position: absolute;
    width: 4.5%;
    aspect-ratio: 1 / 1;

    border: none;
    border-radius: 50%;

    background: red;
    color: white;

    font-size: clamp(10px, 2cqw, 20px);
    font-weight: bold;
    cursor: pointer;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 0;
    line-height: 1;
    box-sizing: border-box;
}

/* =========================
   駐車場などの青い四角
========================= */

.info-btn {
    position: absolute;

    width: 5%;
    aspect-ratio: 1 / 1;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #0078D4;
    color: white;

    border: none;
    border-radius: 0;

    font-size: clamp(18px, 4vw, 40px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;
}

/* =========================
   トイレ
========================= */

.toilet-btn {
    position: absolute;

    width: 5%;
    aspect-ratio: 1 / 1;

    border: none;
    border-radius: 50%;

    background: #0078D4;
    color: white;

    font-size: clamp(10px, 2vw, 20px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;
}

/* =========================
   児童文化センター
========================= */

.center-btn {
    position: absolute;

    width: 5%;
    aspect-ratio: 1 / 1;

    border: none;
    border-radius: 50%;

    background: #FFD700;
    color: white;

    font-size: clamp(10px, 2vw, 20px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;
}

/* =========================
   公園関係（オレンジ四角）
========================= */

.park-btn {
    position: absolute;

    width: 5.4%;
    aspect-ratio: 1 / 1;

    border: none;
    border-radius: 0;

    background: #FF8C00;
    color: white;

    font-size: clamp(18px, 4vw, 40px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;
}

/* =========================
   歴史ボタン
========================= */

.history-btn {
    position: absolute;

    width: 18%;
    height: 5.02%;

    border: none;
    background: #FF8C00;
    color: white;

    font-size: clamp(8px, 2cqw, 20px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 0;
    line-height: 1.2;
    text-align: center;
    box-sizing: border-box;
}

/* =========================
   ルートボタン
========================= */

.route-btn {
    position: absolute;

    width: 12.5%;
    height: 3.76%;

    background: black;
    color: white;

    border: none;

    font-size: clamp(8px, 1.8cqw, 20px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;

    /* 文字を中央に配置 */
    display: flex;
    justify-content: center;
    align-items: center;

    /* 余計なズレをなくす */
    padding: 0;
    line-height: 1.2;
    text-align: center;
    box-sizing: border-box;
}

/* =========================
   藤棚・東屋（黄緑四角）
========================= */

.any-btn {
    position: absolute;

    width: 3%;
    aspect-ratio: 1 / 1;

    border: none;
    border-radius: 0;

    background: #B8D200;
    color: white;

    font-size: clamp(8px, 1.8cqw, 18px);
    font-weight: bold;

    cursor: pointer;
    z-index: 100;

    /* 文字を中央に配置 */
    display: flex;
    justify-content: center;
    align-items: center;

    /* 余計なズレをなくす */
    padding: 0;
    line-height: 1;
    box-sizing: border-box;
}

   各ボタンの位置
========================= */

.parking2 { left: 46%; top: 88.78%; }
.parking3 { left: 45.5%; top: 93.80%; }

/* トイレ */

.toilet2 { left: 42.65%; top: 43.04%; }
.toilet3 { left: 13.75%; top: 64.06%; }
.toilet4 { left: 34.9%; top: 82.19%; }

/* 公園関係 */
.park1 { left: 63.5%; top: 25.10%; }
.park2 { left: 32.6%; top: 87.09%; }

/* 児童文化センター */
.center { left: 40%; top: 13.80%; }

/* 藤棚・東屋 */
.any1 { left: 34%; top: 7.53%; }
.any2 { left: 21.5%; top: 42.29%; }
.any3 { left: 63%; top: 90.67%; }

/* ルート */
.route { left: 80%; top: 17.57%; }


/* =========================
   モーダル
========================= */

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.6);

    z-index: 1000;
    overflow: auto;
}

.modal-content {
    background: white;

    width: 60%;
    max-width: 700px;

    margin: 80px auto;
    padding: 20px;

    border-radius: 15px;
    text-align: center;
}

.modal-content img {
    width: 100%;
    height: auto;
}

.close-btn {
    margin-top: 20px;
    padding: 10px 30px;
    font-size: 18px;
    cursor: pointer;
}


/* =========================
   ルートの画像・動画
========================= */

.route-image-container img {

.route-video {

    top: 20%;

    z-index: 10;
}


/* =========================
   Prev / Next
========================= */

.modal-content {
    position: relative;
}

.prev-btn,
.next-btn {
    position: absolute;
    top: 94%;
    transform: translateY(-50%);

    background: white;
    border: 2px solid black;
    border-radius: 5px;

    color: black;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    width: 130px;
    height: 60px;

    padding: 0;

    display: flex;
    justify-content: center;
    align-items: center;
}

.prev-btn {
    left: 150px;
}

.next-btn {
    right: 150px;
}

/* =========================
   スマホ用
========================= */
@media screen and (max-width: 600px) {

        width: 94% !important;
        max-width: none !important;

        margin: 20px auto !important;
        padding: 15px !important;

        box-sizing: border-box;
    }

    /* Next / Prev */
    .prev-btn,
    .next-btn {
        width: 38% !important;
        height: 48px !important;

        font-size: 18px !important;

        top: auto !important;
        bottom: 20px !important;

        transform: none !important;
    }

    .prev-btn {
        left: 5% !important;
        right: auto !important;
    }

    .next-btn {
        right: 5% !important;
        left: auto !important;
    }
}

<script>
function openModal(id){
    document.getElementById(id).style.display = "block";
}

function closeModal(id){
    document.getElementById(id).style.display = "none";
}

const spots = [
    "spot1",
    "spot2",
    "spot3",
    "spot4",
    "spot5",
    "spot6",
    "spot7",
    "spot8"
];

function changeSpot(currentSpot, direction) {

    const currentIndex = spots.indexOf(currentSpot);

    let nextIndex = currentIndex + direction;

    // ①の前 → ⑧へ
    if (nextIndex < 0) {
        nextIndex = spots.length - 1;
    }

    // ⑧の次 → ①へ
    if (nextIndex >= spots.length) {
        nextIndex = 0;
    }

    // 今開いているポップアップを閉じる
    document.getElementById(currentSpot).style.display = "none";

    // 次のポップアップを開く
    document.getElementById(spots[nextIndex]).style.display = "block";
}

</script>
