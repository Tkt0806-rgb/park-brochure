<style>
body{margin:0;text-align:center;font-family:sans-serif;}

.map-container{position:relative;display:inline-block;}

.map{width:1000%;max-width:100%;display:block;}

.spot{position:absolute;width:45%;height:45%;border:none;border-radius:50%;background:red;color:white;font-size:20%;font-weight:bold;cursor:pointer;}

.route-image-container {
    position: relative;
    width: 100%;
}

.route-image-container img {
    width: 100%;
    display: block;
}

.route-video {
    position: absolute;

    /* 動画を置く位置 */
    left: 10%;
    top: 20%;

    /* 動画の大きさ */
    width: 30%;

    z-index: 10;
}

.modal-content {position: relative;}

.prev-btn,
.next-btn {
    position: absolute;
    top: 94%;
    transform: translateY(-50%);

    background: white;
    border: 2% solid black;
    border-radius: 5%;

    color: black;
    font-size: 18%;
    font-weight: bold;
    cursor: pointer;

    width: 130%;
    height: 60%;
    padding: 0;

    /* 文字をボタンの中央にする */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Prevの位置 */
.prev-btn {
    left: 150%;
}

/* Nextの位置 */
.next-btn {
    right: 150%;
}

/* 青い四角ボタン */
.info-btn{position:absolute;width:50%;height:50%;display:flex;justify-content:center;align-items:center;background:#0078D4;color:white;border:none;border-radius:0;font-size:40%;font-weight:bold;cursor:pointer;z-index:100;}

/* トイレ（青い丸） */
.toilet-btn{position:absolute;width:50%;height:50%;border:none;border-radius:50%;background:#0078D4;color:white;font-size:20%;font-weight:bold;cursor:pointer;z-index:100;}

/* センター（黄色い丸） */
.center-btn{position:absolute;width:50%;height:50%;border:none;border-radius:50%;background:#FFD700;color:white;font-size:20%;font-weight:bold;cursor:pointer;z-index:100;}

/* 公園（オレンジの四角） */
.park-btn{position:absolute;width:54%;height:54%;border:none;border-radius:0;background:#FF8C00;color:white;font-size:40%;font-weight:bold;cursor:pointer;z-index:100;}

/* 歴史（オレンジの四角） */
.history-btn{position:absolute;width:180%;height:80%;border:none;border-radius:0;background:#FF8C00;color:white;font-size:20%;font-weight:bold;cursor:pointer;z-index:100;}

/* ルート（黒の四角） */
.route-btn{position:absolute;width:125%;height:60%;border:none;border-radius:0;background:black;color:white;font-size:20%;font-weight:bold;cursor:pointer;z-index:100;}

/* いろいろ（黄緑の四角） */
.any-btn{position:absolute;width:30%;height:30%;border:none;border-radius:0;background:#B8D200;color:white;font-size:20%;font-weight:bold;cursor:pointer;z-index:100;}


/* ①②の位置は必要に応じて調整 */

<script>
function openModal(id){
    document.getElementById(id).style.display = "block";
}

function closeModal(id){
    document.getElementById(id).style.display = "none";
}

const spots = [
    "spot1",
    "spot2",
    "spot3",
    "spot4",
    "spot5",
    "spot6",
    "spot7",
    "spot8"
];

function changeSpot(currentSpot, direction) {

    const currentIndex = spots.indexOf(currentSpot);

    let nextIndex = currentIndex + direction;

    // ①の前 → ⑧へ
    if (nextIndex < 0) {
        nextIndex = spots.length - 1;
    }

    // ⑧の次 → ①へ
    if (nextIndex >= spots.length) {
        nextIndex = 0;
    }

    // 今開いているポップアップを閉じる
    document.getElementById(currentSpot).style.display = "none";

    // 次のポップアップを開く
    document.getElementById(spots[nextIndex]).style.display = "block";
}

</script>
